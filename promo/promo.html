<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Funnel promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Color+Emoji&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fff; }
  body { font-family: Inter, "Noto Color Emoji", sans-serif; -webkit-font-smoothing: antialiased; }
  .emoji { font-family: "Noto Color Emoji"; }

  #stage { position: absolute; inset: 0; overflow: hidden; background: #fff; transform-origin: 50% 50%; }

  /* ---------- chat ---------- */
  #chat { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
  .stamp { text-align: center; color: #8a8a8e; font-size: 33px; line-height: 1.3; padding: 30px 0 34px; }
  .stamp b { font-weight: 600; }
  .row { display: flex; padding: 0 44px; position: relative; }
  .row.me { justify-content: flex-end; }
  .row.them { justify-content: flex-start; }
  .row.gap { margin-top: 30px; }
  .row.tight { margin-top: 7px; }

  .bubble { position: relative; max-width: 760px; font-size: 47px; line-height: 61px; padding: 18px 36px 20px;
            border-radius: 52px; letter-spacing: -0.012em; transform-origin: bottom right; word-wrap: break-word; }
  .me .bubble { background: #0B84FE; color: #fff; }
  .them .bubble { background: #E9E9EB; color: #000; transform-origin: bottom left; }
  /* tails */
  .me .bubble.tail::before { content: ""; position: absolute; bottom: 0; right: -22px; width: 56px; height: 56px; background: #0B84FE; border-bottom-left-radius: 44px; }
  .me .bubble.tail::after  { content: ""; position: absolute; bottom: 0; right: -30px; width: 30px; height: 56px; background: #fff; border-bottom-left-radius: 28px; }
  .them .bubble.tail::before { content: ""; position: absolute; bottom: 0; left: -22px; width: 56px; height: 56px; background: #E9E9EB; border-bottom-right-radius: 44px; }
  .them .bubble.tail::after  { content: ""; position: absolute; bottom: 0; left: -30px; width: 30px; height: 56px; background: #fff; border-bottom-right-radius: 28px; }

  .typing { padding: 0; width: 170px; height: 101px; display: flex; align-items: center; justify-content: center; gap: 14px; }
  .typing i { width: 22px; height: 22px; border-radius: 50%; background: #8e8e93; display: block; }
  .typing.tail::before, .typing.tail::after { display: block; }

  .status { text-align: right; color: #8a8a8e; font-size: 30px; font-weight: 500; padding: 8px 52px 0 0; }

  /* link card */
  .card { padding: 0; width: 740px; overflow: hidden; background: #E9E9EB !important; color: #000 !important; }
  .card .hero { height: 400px; background: linear-gradient(135deg, #2557d6 0%, #1b3a8f 55%, #0e1a3a 100%); display: flex; align-items: center; justify-content: center; gap: 36px; position: relative; overflow: hidden; }
  .card .hero .logo { width: 190px; height: 190px; border-radius: 42px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.35); }
  .card .hero .logo img { width: 100%; height: 100%; display: block; }
  .card .hero .wm { color: #fff; font-weight: 800; font-size: 96px; letter-spacing: -0.03em; }
  .card .hero .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px); background-size: 60px 60px; }
  .card .meta { padding: 24px 34px 28px; }
  .card .meta .t { font-weight: 600; font-size: 40px; line-height: 50px; letter-spacing: -0.01em; }
  .card .meta .s { color: #6d6d72; font-size: 34px; line-height: 44px; margin-top: 2px; }

  /* tapback */
  .tapback { position: absolute; top: -84px; left: -62px; width: 128px; height: 112px; border-radius: 56px; background: #E9E9EB;
             border: 6px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 58px; font-weight: 800; color: #0B84FE; letter-spacing: -7px; padding-right: 6px; transform-origin: 70% 90%; }
  .tapback::after { content: ""; position: absolute; width: 26px; height: 26px; border-radius: 50%; background: #E9E9EB; border: 5px solid #fff; right: -4px; bottom: -14px; }

  /* ---------- top chrome ---------- */
  #header { position: absolute; left: 0; right: 0; top: 0; height: 392px; background: rgba(246,246,246,.88); backdrop-filter: blur(28px) saturate(1.6); border-bottom: 2px solid #dcdce0; z-index: 5; }
  .sb { position: absolute; top: 46px; left: 0; right: 0; height: 60px; }
  .sb .time { position: absolute; left: 122px; top: 0; font-weight: 600; font-size: 46px; letter-spacing: -0.01em; }
  .sb svg { position: absolute; top: 8px; }
  .back { position: absolute; left: 30px; top: 214px; display: flex; align-items: center; gap: 10px; color: #0B84FE; }
  .back .badge { background: #0B84FE; color: #fff; font-size: 33px; font-weight: 600; border-radius: 30px; padding: 4px 18px; }
  .avatar { position: absolute; left: 50%; top: 170px; width: 136px; height: 136px; margin-left: -68px; border-radius: 50%;
            background: linear-gradient(180deg, #a5abb8, #858b98); color: #fff; font-size: 62px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .cname { position: absolute; left: 0; right: 0; top: 318px; text-align: center; font-size: 33px; color: #000; }
  .cname span { color: #a1a1a6; font-size: 28px; margin-left: 6px; }
  .video { position: absolute; right: 50px; top: 220px; }

  /* ---------- input bar ---------- */
  #bar { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; z-index: 5; padding: 18px 30px 104px; display: flex; align-items: flex-end; gap: 22px; }
  .plus { width: 98px; height: 98px; border-radius: 50%; background: #EEEEF0; flex: none; display: flex; align-items: center; justify-content: center; }
  .field { flex: 1; min-height: 98px; border: 3px solid #d6d6db; border-radius: 50px; padding: 16px 104px 16px 34px; font-size: 47px; line-height: 61px; position: relative; letter-spacing: -0.012em; }
  .field .ph { color: #b8b8bd; }
  .field .caret { display: inline-block; width: 4px; height: 54px; background: #0B84FE; vertical-align: -10px; margin-left: 2px; }
  .send { position: absolute; right: 10px; bottom: 10px; width: 76px; height: 76px; border-radius: 50%; background: #0B84FE; display: flex; align-items: center; justify-content: center; }
  .mic { position: absolute; right: 26px; bottom: 20px; }
  .home { position: absolute; left: 50%; bottom: 24px; width: 380px; height: 14px; margin-left: -190px; border-radius: 7px; background: #000; z-index: 6; }

  /* ---------- end card ---------- */
  #end { position: absolute; inset: 0; z-index: 20; background: radial-gradient(120% 80% at 30% 20%, #2f63e6 0%, #1c3f9e 45%, #0b1636 100%);
         display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; opacity: 0; overflow: hidden; }
  #end .grid { position: absolute; inset: -200px; background-image: linear-gradient(rgba(255,255,255,.05) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.05) 2px, transparent 2px); background-size: 120px 120px; }
  #end .content { position: relative; display: flex; flex-direction: column; align-items: center; margin-top: -60px; }
  #end .logo { width: 330px; height: 330px; border-radius: 74px; overflow: hidden; box-shadow: 0 40px 90px rgba(0,0,0,.45), 0 0 0 4px rgba(255,255,255,.12); }
  #end .logo img { width: 100%; height: 100%; display: block; }
  #end h1 { font-size: 168px; font-weight: 800; letter-spacing: -0.045em; margin-top: 56px; line-height: 1; }
  #end .tag { font-size: 54px; font-weight: 500; line-height: 72px; text-align: center; margin-top: 34px; color: #dbe5ff; max-width: 860px; letter-spacing: -0.015em; }
  #end .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 64px; max-width: 900px; }
  #end .chip { font-size: 40px; font-weight: 600; padding: 16px 34px; border-radius: 40px; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.22); }
  #end .chip.x { background: #16a34a; border-color: #22c55e; }
  #end .cta { margin-top: 80px; font-size: 52px; font-weight: 700; color: #1d4ed8; background: #fff; padding: 26px 64px; border-radius: 60px; box-shadow: 0 20px 50px rgba(0,0,0,.3); display: flex; align-items: center; gap: 20px; }
  #end .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
</style>
</head>
<body>
<div style="position:absolute;left:-9999px;top:0;font-size:40px"><span class="emoji">😭🤯</span><b style="font-weight:800">Aa</b><b style="font-weight:700">Aa</b><b style="font-weight:600">Aa</b><span style="font-weight:500">Aa</span>Aa</div>
<div id="stage">
  <div id="chat"></div>

  <div id="header">
    <div class="sb">
      <div class="time">9:41</div>
      <!-- signal -->
      <svg style="left:776px" width="58" height="38" viewBox="0 0 58 38"><rect x="0" y="26" width="10" height="12" rx="3"/><rect x="16" y="18" width="10" height="20" rx="3"/><rect x="32" y="9" width="10" height="29" rx="3"/><rect x="48" y="0" width="10" height="38" rx="3"/></svg>
      <!-- wifi -->
      <svg style="left:850px; top:6px" width="54" height="40" viewBox="0 0 54 40"><path d="M27 8c8 0 15 3 20.5 8.2l3.8-3.9C44.8 6 36.3 2.4 27 2.4S9.2 6 2.7 12.3l3.8 3.9C12 11 19 8 27 8z"/><path d="M27 19.5c4.9 0 9.3 1.9 12.6 5l3.9-3.9C39.2 16.6 33.4 14 27 14s-12.2 2.6-16.5 6.6l3.9 3.9c3.3-3.1 7.7-5 12.6-5z"/><path d="M27 31l5.6-5.6A8 8 0 0 0 27 23.2a8 8 0 0 0-5.6 2.2z"/></svg>
      <!-- battery -->
      <svg style="left:920px; top:4px" width="84" height="42" viewBox="0 0 84 42"><rect x="2" y="2" width="70" height="38" rx="11" fill="none" stroke="#000" stroke-opacity=".4" stroke-width="3"/><rect x="8" y="8" width="58" height="26" rx="6"/><path d="M77 15v12c3-1 5-3.5 5-6s-2-5-5-6z" fill-opacity=".45"/></svg>
    </div>
    <div class="back">
      <svg width="34" height="58" viewBox="0 0 34 58"><path d="M29 4L5 29l24 25" fill="none" stroke="#0B84FE" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="badge">12</span>
    </div>
    <div class="avatar">J</div>
    <div class="cname">Jake<span>&#x203A;</span></div>
    <svg class="video" width="84" height="56" viewBox="0 0 84 56"><rect x="2" y="6" width="54" height="44" rx="11" fill="none" stroke="#0B84FE" stroke-width="5"/><path d="M60 22l20-12v36L60 34z" fill="none" stroke="#0B84FE" stroke-width="5" stroke-linejoin="round"/></svg>
  </div>

  <div id="bar">
    <div class="plus"><svg width="44" height="44" viewBox="0 0 44 44"><path d="M22 4v36M4 22h36" stroke="#7d7d82" stroke-width="5.5" stroke-linecap="round"/></svg></div>
    <div class="field" id="field">
      <span id="ftext"></span>
      <svg class="mic" id="mic" width="40" height="58" viewBox="0 0 40 58"><rect x="11" y="2" width="18" height="32" rx="9" fill="#9a9aa0"/><path d="M4 26c0 9 7 16 16 16s16-7 16-16M20 42v12" fill="none" stroke="#9a9aa0" stroke-width="4.5" stroke-linecap="round"/></svg>
      <div class="send" id="send"><svg width="40" height="44" viewBox="0 0 40 44"><path d="M20 40V6M5 20L20 5l15 15" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
  </div>
  <div class="home"></div>
</div>

<div id="end">
  <div class="grid" id="egrid"></div>
  <div class="content">
    <div class="logo" id="elogo"><img src="logo.png"></div>
    <h1 id="ename">Funnel</h1>
    <div class="tag" id="etag">Research, comps and DCFs,<br>straight into Excel.</div>
    <div class="chips" id="echips">
      <div class="chip">Financial data</div>
      <div class="chip">Market research</div>
      <div class="chip">Comps</div>
      <div class="chip">Analyst views</div>
      <div class="chip">DCF models</div>
      <div class="chip x">&#x2192; Excel</div>
    </div>
    <div class="cta" id="ecta">Link in bio <svg width="40" height="40" viewBox="0 0 40 40"><path d="M10 30L30 10M14 10h16v16" fill="none" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>
  <div class="flash" id="eflash"></div>
</div>

<script>
// ---------------- script ----------------
// who: "me" = blue (sender, knows Funnel), "them" = gray (Jake, freaking out)
// type:[start,end] = text typed into the input field before sending; typing:[start,end] = gray "..." bubble
const EM = s => s.replace(/(\p{Extended_Pictographic}️?)/gu, '<span class="emoji">$1</span>');
const SCRIPT = [
  { who: 'me',   at: 1.70, type: [0.30, 1.55], text: 'Hey Bro are you ready for the Stock pitch competition?' },
  { who: 'them', at: 3.60, typing: [2.40, 3.60], text: 'NO BRO IDK WHERE TO GET MY FINANCIAL DATA 😭' },
  { who: 'me',   at: 5.90, type: [5.20, 5.80], text: 'Funnel has that' },
  { who: 'them', at: 7.40, typing: [6.50, 7.40], text: 'Market research bro!' },
  { who: 'me',   at: 9.00, type: [8.40, 8.90], text: 'Funnel has that' },
  { who: 'them', at: 11.00, typing: [9.80, 11.00], text: 'And what about my DCF templates?? idk which one to use' },
  { who: 'me',   at: 14.30, type: [12.60, 14.20], text: 'Funnel has all of them and they preload into an entire Excel just like that' },
  { who: 'me',   at: 15.40, card: true },
  { tapback: 6, at: 16.50, glyph: '!!' },
  { who: 'them', at: 18.00, typing: [17.00, 18.00], text: 'bro WHAT 🤯' },
  { who: 'them', at: 19.50, typing: [18.60, 19.50], text: 'downloading it rn' },
];
const END_AT = 21.6;   // chat -> end card transition
const DURATION = 30;

// ---------------- build DOM ----------------
const chat = document.getElementById('chat');
chat.innerHTML = '<div class="stamp"><b>iMessage</b><br>Today 9:41 PM</div>';
const items = [];   // { el, row, bubble, at, until, who, kind }
let msgIdx = [];    // SCRIPT index -> items index
SCRIPT.forEach((s, i) => {
  if (s.tapback !== undefined) return;
  if (s.typing) {
    const row = document.createElement('div');
    row.className = 'row them';
    row.innerHTML = '<div class="bubble typing tail"><i></i><i></i><i></i></div>';
    chat.appendChild(row);
    items.push({ row, bubble: row.firstChild, at: s.typing[0], until: s.typing[1], who: 'them', kind: 'typing' });
  }
  const row = document.createElement('div');
  row.className = 'row ' + s.who;
  if (s.card) {
    row.innerHTML = `<div class="bubble card"><div class="hero"><div class="grid"></div><div class="logo"><img src="logo.png"></div><div class="wm">Funnel</div></div>
      <div class="meta"><div class="t">Funnel: financials, comps &amp; DCFs in Excel</div><div class="s">Type a ticker. Get the whole model.</div></div></div>`;
  } else {
    row.innerHTML = `<div class="bubble">${EM(s.text)}</div>`;
  }
  chat.appendChild(row);
  msgIdx[i] = items.length;
  items.push({ row, bubble: row.firstChild, at: s.at, until: Infinity, who: s.who, kind: s.card ? 'card' : 'msg', script: s });
});
const status = document.createElement('div');
status.className = 'status';
status.textContent = 'Delivered';
chat.appendChild(status);

// tapbacks
const tapbacks = SCRIPT.filter(s => s.tapback !== undefined).map(s => {
  const it = items[msgIdx[s.tapback]];
  const tb = document.createElement('div');
  tb.className = 'tapback';
  tb.textContent = s.glyph;
  it.bubble.appendChild(tb);
  return { el: tb, at: s.at, item: it };
});

// ---------------- easing ----------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeInOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
// damped spring 0 -> 1
const spring = (x, k = 9, d = 5.5) => x <= 0 ? 0 : 1 - Math.exp(-d * x) * Math.cos(k * x);

// ---------------- render(t) ----------------
const field = document.getElementById('ftext'), sendBtn = document.getElementById('send'), mic = document.getElementById('mic');
const header = document.getElementById('header'), bar = document.getElementById('bar');
let smoothH = null, lastT = -1;

window.render = function (t) {
  if (t < lastT) smoothH = null;
  const dt = lastT < 0 || t < lastT ? 0 : t - lastT;
  lastT = t;

  // input field typing
  let typed = '', active = null;
  for (const s of SCRIPT) if (s.type && t >= s.type[0] && t < s.at) active = s;
  if (active) {
    const p = clamp((t - active.type[0]) / (active.type[1] - active.type[0]));
    typed = active.text.slice(0, Math.round(p * active.text.length));
  }
  const caretOn = Math.floor(t * 2.2) % 2 === 0 || (active && t < active.type[1]);
  field.innerHTML = typed ? EM(typed.replace(/&/g, '&amp;')) + (caretOn ? '<span class="caret"></span>' : '')
                          : (caretOn && t < END_AT ? '<span class="caret" style="margin-left:0;margin-right:4px"></span>' : '') + '<span class="ph">iMessage</span>';
  sendBtn.style.display = typed ? 'flex' : 'none';
  mic.style.display = typed ? 'none' : 'block';

  // visibility + grouping
  const vis = items.filter(it => t >= it.at && t < it.until);
  items.forEach(it => { it.row.style.display = 'none'; });
  vis.forEach((it, i) => {
    it.row.style.display = 'flex';
    const prev = vis[i - 1], next = vis[i + 1];
    it.row.classList.toggle('gap', !!prev && prev.who !== it.who);
    it.row.classList.toggle('tight', !!prev && prev.who === it.who);
    const isLast = !next || next.who !== it.who;
    it.bubble.classList.toggle('tail', isLast && it.kind !== 'card');
    // pop-in
    const age = t - it.at;
    const s = it.kind === 'typing' ? easeOut(age / 0.22) : spring(age / 0.55, 9, 5.5);
    const sc = 0.55 + 0.45 * s;
    const ty = (1 - clamp(s)) * 60;
    it.bubble.style.opacity = clamp(age / 0.12);
    it.bubble.style.transform = `translateY(${ty}px) scale(${sc})`;
    if (it.kind === 'typing') {
      it.bubble.querySelectorAll('i').forEach((d, k) => {
        const ph = (t * 2.6 - k * 0.18) % 1;
        const b = Math.max(0, Math.sin(ph * Math.PI * 2));
        d.style.transform = `translateY(${-b * 9}px)`;
        d.style.opacity = 0.45 + 0.55 * b;
      });
    }
  });

  // tapbacks (reserve space above the bubble once they appear)
  tapbacks.forEach(tb => {
    const age = t - tb.at;
    if (age < 0) { tb.el.style.display = 'none'; tb.item.row.style.marginTop = ''; return; }
    tb.el.style.display = 'flex';
    const s = spring(age / 0.5, 10, 6);
    tb.el.style.transform = `scale(${0.2 + 0.8 * s}) rotate(${(1 - clamp(s)) * -25}deg)`;
    tb.el.style.opacity = clamp(age / 0.08);
    tb.item.row.style.marginTop = (7 + 60 * easeOut(age / 0.25)) + 'px';
  });

  // "Delivered" under my last message if it is the newest
  const lastVis = vis[vis.length - 1];
  status.style.display = lastVis && lastVis.who === 'me' && lastVis.kind !== 'typing' && t - lastVis.at > 0.6 ? 'block' : 'none';

  // scroll: top-aligned until the chat overflows, then bottom-anchored; smoothed
  const top = header.offsetHeight;
  const bottom = 1920 - bar.offsetHeight - 26;
  const H = chat.offsetHeight;
  if (smoothH === null) smoothH = H;
  smoothH += (H - smoothH) * (1 - Math.exp(-dt / 0.085));
  const avail = bottom - top;
  const y = top + Math.min(0, avail - smoothH);
  chat.style.transform = `translateY(${y}px)`;

  // ---------- end card ----------
  const end = document.getElementById('end'), stage = document.getElementById('stage');
  const e = t - END_AT;
  if (e < 0) {
    end.style.opacity = 0;
    stage.style.transform = ''; stage.style.filter = '';
    return;
  }
  const out = easeInOut(e / 0.55);
  stage.style.transform = `scale(${1 - 0.08 * out}) translateY(${-60 * out}px)`;
  stage.style.filter = `blur(${out * 14}px)`;
  end.style.opacity = easeOut((e - 0.15) / 0.45);
  end.style.clipPath = `circle(${easeInOut((e - 0.05) / 0.6) * 150}% at 50% 100%)`;
  document.getElementById('egrid').style.transform = `translateY(${(e * 30) % 120}px)`;

  const pop = (el, start, d = 0.6, from = 0.4, rise = 50) => {
    const a = t - END_AT - start;
    const s = spring(a / d, 9, 5);
    el.style.opacity = clamp(a / 0.15);
    el.style.transform = `translateY(${(1 - clamp(s)) * rise}px) scale(${from + (1 - from) * s})`;
  };
  pop(document.getElementById('elogo'), 0.45, 0.75, 0.2, 0);
  pop(document.getElementById('ename'), 0.85, 0.6, 0.85, 60);
  pop(document.getElementById('etag'), 1.15, 0.6, 0.95, 40);
  [...document.getElementById('echips').children].forEach((c, k) => pop(c, 1.75 + k * 0.22, 0.5, 0.6, 30));
  const cta = document.getElementById('ecta');
  pop(cta, 3.4, 0.7, 0.5, 40);
  const pulse = t - END_AT > 4.4 ? 1 + 0.035 * Math.sin((t - END_AT - 4.4) * 5.5) : null;
  if (pulse) cta.style.transform = `scale(${pulse})`;
  const fl = document.getElementById('eflash');
  fl.style.opacity = 0.35 * Math.max(0, 1 - Math.abs(e - 0.5) / 0.18);
};

// event list for the sound track
window.events = function () {
  const ev = [];
  SCRIPT.forEach(s => {
    if (s.tapback !== undefined) ev.push({ t: s.at, kind: 'tapback' });
    else if (s.who === 'me') ev.push({ t: s.at, kind: 'send' });
    else ev.push({ t: s.at, kind: 'receive' });
    if (s.type) {
      const n = s.text.length, d = s.type[1] - s.type[0];
      const step = Math.max(0.075, d / n * 2.5);  // brisk key clicks, not one per character
      for (let x = s.type[0]; x < s.type[1]; x += step) ev.push({ t: x, kind: 'key' });
    }
  });
  ev.push({ t: END_AT, kind: 'whoosh' });
  ev.push({ t: END_AT + 0.45, kind: 'chime' });
  ev.push({ t: END_AT + 3.4, kind: 'pop' });
  return { events: ev, duration: DURATION };
};

// live preview when opened directly (?preview)
if (location.search.includes('preview')) {
  const t0 = performance.now();
  const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  document.fonts.ready.then(loop);
} else {
  document.fonts.ready.then(() => render(0));
}
</script>
</body>
</html>
